name: "✨ Proposer une amélioration / Nouveau matériel (Feature Request)"
description: "Suggérer une nouvelle fonctionnalité ou la prise en charge d'un nouvel appareil"
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: "Plugin concerné"
      options:
        - "altAirMedia (Apple TV & HomePod)"
        - "altBambuLab (Imprimantes 3D Bambu Lab P1S / X1C / A1 & AMS)"
        - "altCambridgeAudio (Cambridge Audio StreamMagic)"
        - "altDenon (Amplis Denon & Marantz AVR / HEOS)"
        - "altHue (Alt Éclairage & Ambiance — Philips Hue & Hue Play Local)"
        - "altJvcProjector (Vidéoprojecteurs JVC D-ILA)"
        - "altPronote (Vie Scolaire PRONOTE — Élève & Parent)"
        - "altRoborock (Robots Aspirateurs Roborock S7 / Qrevo Curv Local)"
        - "altSamsungTv (Samsung Smart TV & The Frame)"
        - "altSiemens (Siemens EQ900 & Home Connect Local)"
        - "altSonos (Alt Multiroom Audio — Sonos Amp, Port, Connect & Enceintes S1/S2)"
        - "altSwitch (Alt Contrôle Parental — Nintendo Switch, OLED, Lite & Switch 2)"
        - "altTwinkly (Alt Éclairages & Effets LED — Twinkly Strings, Squares, Flex, Curtain, Tree)"
        - "altTydom (Alt Habitat & Domotique — Delta Dore Tydom)"
        - "Nouveau plugin / Autre"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: "Modèle de l'appareil concerné (si applicable)"
      placeholder: "Ex: Siemens Lave-vaisselle SN..., JVC DLA-NZ800, Cambridge CXN100..."

  - type: textarea
    id: description
    attributes:
      label: "Description de la fonctionnalité souhaitée"
      placeholder: "Décrivez la commande, l'information ou le comportement que vous aimeriez voir ajouté..."
    validations:
      required: true
