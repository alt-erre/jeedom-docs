name: "✨ Proposer une amélioration / Nouveau matériel (Feature Request)"
description: "Suggérer une nouvelle fonctionnalité ou la prise en charge d'un nouvel appareil"
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: "Plugin concerné"
      options:
        - "altAirMedia (Alt Air Média — Apple TV & HomePod)"
        - "altArlo (Alt Caméras & Sécurité — Arlo)"
        - "altBambuLab (Alt Print 3D — Bambu Lab P1S / X1C / A1 & AMS)"
        - "altCambridgeAudio (Alt Audio — Cambridge StreamMagic)"
        - "altCellular (Alt Téléphonie, MMS & Portail GSM)"
        - "altDenon (Alt AVR Control — Denon & Marantz / HEOS)"
        - "altEducartable (Alt Vie Scolaire — Educartable / Edumoov)"
        - "altHue (Alt Éclairage & Ambiance — Philips Hue)"
        - "altIos (Alt Contrôle Parental — iPhone & iPad)"
        - "altJvcProjector (Alt Ciné Projector — JVC D-ILA)"
        - "altNetGuard (Alt Radar & Sécurité Réseau)"
        - "altNuki (Alt Serrure & Accès — Nuki)"
        - "altPlaystation (Alt Contrôle Parental — PlayStation PS5 & PS4)"
        - "altPronote (Alt Vie Scolaire — Pronote)"
        - "altRoborock (Alt Robot Vacuum — Roborock Local)"
        - "altSamsungTv (Alt Frame & Smart TV — Samsung)"
        - "altSiemens (Alt Café & Home Connect — Siemens)"
        - "altSonos (Alt Multiroom Audio — Sonos)"
        - "altSwitch (Alt Contrôle Parental — Nintendo Switch)"
        - "altTvDashboard (Alt Dashboard & Kiosk TV)"
        - "altTwinkly (Alt Éclairages & Effets LED — Twinkly)"
        - "altTydom (Alt Habitat & Domotique — Delta Dore Tydom)"
        - "altXbox (Alt Contrôle Parental — Xbox)"
        - "Nouveau plugin / Autre"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: "Modèle de l'appareil concerné (si applicable)"
      placeholder: "Ex: Siemens Lave-vaisselle SN..., JVC DLA-NZ800, Cambridge CXN100..."

  - type: textarea
    id: description
    attributes:
      label: "Description de la fonctionnalité souhaitée"
      placeholder: "Décrivez la commande, l'information ou le comportement que vous aimeriez voir ajouté..."
    validations:
      required: true
